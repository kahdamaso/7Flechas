{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Primeiro uso{% endblock %}
{% block conteudo %}
<div class="mx-auto caixa-acesso">
  <h1 class="h4 mt-3">Bem-vindo(a) ao TUC7FJ</h1>
  <p class="text-muted">Defina a <strong>senha da casa</strong>. Ela será usada em todos os aparelhos (celular, tablet e computador) para entrar no sistema.</p>
  <form method="post">
    {{ csrf() }}
    <div class="mb-3"><label class="form-label" for="senha">Senha da casa</label>
      <input class="form-control" id="senha" type="password" name="senha" required minlength="6" autocomplete="new-password"></div>
    <div class="mb-3"><label class="form-label" for="senha2">Repita a senha</label>
      <input class="form-control" id="senha2" type="password" name="senha2" required autocomplete="new-password"></div>
    <button class="btn btn-success btn-lg w-100">Definir senha</button>
  </form>
</div>
{% endblock %}
