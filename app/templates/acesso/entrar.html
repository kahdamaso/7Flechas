{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="mx-auto caixa-acesso">
  <h1 class="h4 mt-3 mb-3">Entrar</h1>
  <form method="post">
    {{ csrf() }}
    <div class="mb-3"><label class="form-label" for="senha">Senha da casa</label>
      <input class="form-control form-control-lg" id="senha" type="password" name="senha" required autofocus autocomplete="current-password"></div>
    <button class="btn btn-success btn-lg w-100">Entrar</button>
  </form>
  <p class="text-muted small mt-3">Este aparelho fica conectado por 30 dias.</p>
</div>
{% endblock %}
