{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<form method="post" class="row g-3" style="max-width: 44rem">
  {{ csrf() }}
  <div class="col-md-4"><label class="form-label">Data *</label>
    <input class="form-control" type="date" name="data" required value="{{ sessao.data.isoformat() if sessao.data else '' }}"></div>
  <div class="col-md-8"><label class="form-label">Tipo</label>
    <input class="form-control" name="tipo" list="tipos" value="{{ sessao.tipo or 'Gira' }}">
    <datalist id="tipos">{% for t in tipos %}<option value="{{ t }}">{% endfor %}</datalist></div>
  <div class="col-12"><label class="form-label">Descrição</label>
    <input class="form-control" name="descricao" value="{{ sessao.descricao or '' }}" placeholder="ex.: Gira de Caboclo com consagração de panos"></div>
  <div class="col-12"><label class="form-label">Observações</label>
    <textarea class="form-control" name="observacoes" rows="3">{{ sessao.observacoes or '' }}</textarea></div>
  <div class="col-12"><button class="btn btn-success">Salvar</button>
    <a class="btn btn-link" href="{{ url_for('sessoes.detalhe', id=sessao.id) if sessao.id else url_for('sessoes.lista') }}">Cancelar</a></div>
</form>
{% endblock %}
