{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="mx-auto" style="max-width: 22rem">
  <h1 class="h4 mb-3 mt-4">Entrar</h1>
  <form method="post">
    {{ csrf() }}
    <div class="mb-3"><label class="form-label" for="login">Usuário</label>
      <input class="form-control" id="login" name="login" required autofocus autocapitalize="none" autocomplete="username"></div>
    <div class="mb-3"><label class="form-label" for="senha">Senha</label>
      <input class="form-control" id="senha" type="password" name="senha" required autocomplete="current-password"></div>
    <button class="btn btn-success w-100">Entrar</button>
  </form>
  <p class="text-muted small mt-3">Esqueceu a senha? Peça a um administrador para redefinir.</p>
</div>
{% endblock %}
