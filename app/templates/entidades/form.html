{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<form method="post" class="row g-3" style="max-width: 40rem">
  {{ csrf() }}
  <div class="col-md-7"><label class="form-label">Nome *</label>
    <input class="form-control" name="nome" required value="{{ ent.nome or '' }}"></div>
  <div class="col-md-5"><label class="form-label">Linha *</label>
    <select class="form-select" name="linha_id" required>
      <option value="">—</option>
      {% for l in linhas %}<option value="{{ l.id }}" {% if l.id == ent.linha_id %}selected{% endif %}>{{ l.nome }}</option>{% endfor %}
    </select></div>
  <div class="col-12"><label class="form-label">Observações</label>
    <textarea class="form-control" name="observacoes" rows="2">{{ ent.observacoes or '' }}</textarea></div>
  <div class="col-12"><button class="btn btn-success">Salvar</button>
    <a class="btn btn-link" href="{{ url_for('entidades.lista') }}">Cancelar</a></div>
</form>
{% endblock %}
