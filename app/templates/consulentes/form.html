{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<form method="post" class="row g-3">
  {{ csrf() }}
  <div class="col-md-8"><label class="form-label">Nome completo *</label>
    <input class="form-control" name="nome" required value="{{ form.get('nome', c.nome or '') }}"></div>
  <div class="col-md-4"><label class="form-label">CPF</label>
    <input class="form-control" name="cpf" value="{{ form.get('cpf', c.cpf|cpf) }}" placeholder="000.000.000-00"></div>
  <div class="col-md-4"><label class="form-label">Data de nascimento</label>
    <input class="form-control" type="date" name="data_nascimento"
           value="{{ form.get('data_nascimento', c.data_nascimento.isoformat() if c.data_nascimento else '') }}"></div>
  <div class="col-md-4"><label class="form-label">Telefone</label>
    <input class="form-control" name="telefone" value="{{ form.get('telefone', c.telefone|telefone) }}"></div>
  <div class="col-md-4"><label class="form-label">E-mail</label>
    <input class="form-control" type="email" name="email" value="{{ form.get('email', c.email or '') }}"></div>
  <div class="col-md-6"><label class="form-label">Endereço</label>
    <input class="form-control" name="endereco" value="{{ form.get('endereco', c.endereco or '') }}"></div>
  <div class="col-md-6"><label class="form-label">Bairro</label>
    <input class="form-control" name="bairro" value="{{ form.get('bairro', c.bairro or '') }}"></div>
  <div class="col-md-9"><label class="form-label">Cidade</label>
    <input class="form-control" name="cidade" value="{{ form.get('cidade', c.cidade or '') }}"></div>
  <div class="col-md-3"><label class="form-label">UF</label>
    <input class="form-control" name="uf" maxlength="2" value="{{ form.get('uf', c.uf or '') }}"></div>
  <div class="col-12"><label class="form-label">Observações</label>
    <textarea class="form-control" name="observacoes" rows="3">{{ form.get('observacoes', c.observacoes or '') }}</textarea></div>
  <div class="col-12">
    <button class="btn btn-success">Salvar</button>
    <a class="btn btn-link" href="{{ url_for('consulentes.detalhe', id=c.id) if c.id else url_for('consulentes.lista') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
