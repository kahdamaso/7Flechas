{# filtro de período + exportação; usa `de`, `ate` e, opcionalmente, `extra_filtros` #}
<form method="get" class="row g-2 align-items-end mb-3">
  <div class="col-6 col-md-3"><label class="form-label small mb-1" for="de">De</label>
    <input class="form-control" type="date" id="de" name="de" value="{{ de.isoformat() }}"></div>
  <div class="col-6 col-md-3"><label class="form-label small mb-1" for="ate">Até</label>
    <input class="form-control" type="date" id="ate" name="ate" value="{{ ate.isoformat() }}"></div>
  {{ extra_filtros|default('') }}
  <div class="col-6 col-md-2"><button class="btn btn-outline-secondary w-100">Filtrar</button></div>
  <div class="col-6 col-md-2">
    <a class="btn btn-outline-success w-100"
       href="{{ url_for(request.endpoint, de=de.isoformat(), ate=ate.isoformat(), categoria=request.args.get('categoria', ''), formato='csv') }}">Planilha (CSV)</a>
  </div>
</form>
<p class="small text-muted">Período: {{ de|data }} a {{ ate|data }}.</p>
